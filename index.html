<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Job Order System</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: #333; text-align: center; border-bottom: 2px solid #007BFF; padding-bottom: 10px; }
        label { font-weight: bold; display: block; margin: 15px 0 5px; color: #555; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        textarea { resize: vertical; }
        button { background-color: #007BFF; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 25px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 20px; font-weight: bold; text-align: center; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
<div class="form-container">
    <h2>IT Job Order Form</h2>
    <form id="jobOrderForm">
        <label for="jobOrder">Job Order Description</label>
        <textarea id="jobOrder" rows="4" required placeholder="Describe the technical issue..."></textarea>
        <label for="techAssignment">Assigned Technician</label>
        <select id="techAssignment" required>
            <option value="">-- Select Tech --</option>
            <option value="Tech Alpha">Tech Alpha</option>
            <option value="Tech Bravo">Tech Bravo</option>
            <option value="Tech Charlie">Tech Charlie</option>
        </select>
        <label for="status">Current Status</label>
        <select id="status" required>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
        </select>
        <button type="submit">Submit Job Order</button>
    </form>
    <div id="message"></div>
</div>
<script>
    document.getElementById('jobOrderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const msgDiv = document.getElementById('message');
        msgDiv.innerText = "Submitting to secure server...";
        const formData = {
            jobOrder: document.getElementById('jobOrder').value,
            techAssignment: document.getElementById('techAssignment').value,
            status: document.getElementById('status').value
        };
        fetch('/submit-job', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                msgDiv.innerText = "Job Order Saved Successfully!";
                document.getElementById('jobOrderForm').reset();
            } else {
                msgDiv.innerText = "Error: Failed to save data.";
            }
        }).catch(() => { msgDiv.innerText = "Submission Failed."; });
    });
</script>
</body>
</html>
