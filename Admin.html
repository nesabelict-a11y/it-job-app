<!-- Admin.html -->
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 20px; background-color: #f8f9fa; }
    .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .status-pending { background-color: #fff3cd; color: #856404; font-weight: bold; padding: 4px 8px; border-radius: 4px;}
    .kpi-card { border-radius: 10px; border: none; color: white; }
    .kpi-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; }
    .kpi-value { font-size: 2.5rem; font-weight: bold; margin: 0; }
  </style>
</head>
<body>
  
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="m-0">🖥️ NESABEL ICT Admin Dashboard</h2>
      <a href="https://accounts.google.com/Logout" target="_top" class="btn btn-outline-danger">🚪 Logout</a>
    </div>
    
    <!-- NEW: KPI Performance Scorecards -->
    <div class="row mb-4">
      <div class="col-md-3">
        <div class="card kpi-card bg-primary p-3 text-center">
          <div class="kpi-title">Total Pending</div>
          <div class="kpi-value" id="kpiPending">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card kpi-card bg-danger p-3 text-center">
          <div class="kpi-title">Unassigned Action Needed</div>
          <div class="kpi-value" id="kpiUnassigned">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card kpi-card bg-success p-3 text-center">
          <div class="kpi-title">Total Resolved</div>
          <div class="kpi-value" id="kpiDone">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card kpi-card bg-info p-3 text-center text-dark">
          <div class="kpi-title">My Resolves</div>
          <div class="kpi-value" id="kpiMyResolves">0</div>
        </div>
      </div>
    </div>
    
    <div class="row">
      <!-- Left Column: Submit New Ticket Form -->
      <div class="col-md-4">
        <div class="card">
          <div class="card-header bg-primary text-white">Log Job Order</div>
          <div class="card-body">
            <form id="jobForm">
              <div class="mb-3">
                <label class="form-label">User Email Address</label>
                <input type="email" id="userName" class="form-control" required value="<?= userEmail ?>">
              </div>
              <div class="mb-3">
                <label class="form-label">Category</label>
                <select id="category" class="form-select" required>
                  <option value="" disabled selected>Select a category...</option>
                  <option value="Hardware">Hardware</option>
                  <option value="Network">Network</option>
                  <option value="Software">Software</option>
                  <option value="Access/Permissions">Access/Permissions</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Issue Description</label>
                <textarea id="description" class="form-control" rows="3" required></textarea>
              </div>
              <div class="mb-4">
                <label class="form-label">Attach Screenshot <small class="text-muted">(Optional)</small></label>
                <input type="file" id="attachment" class="form-control" accept="image/*">
              </div>
              <button type="submit" id="submitBtn" class="btn btn-primary w-100">Submit Job Order</button>
            </form>
          </div>
        </div>
      </div>
      
      <!-- Right Column: Interactive Dashboard Queue -->
      <div class="col-md-8">
        <div class="card">
          <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <span>Active Job Queue (Pending Only)</span>
            <button class="btn btn-sm btn-secondary" onclick="loadDashboard()">🔄 Refresh</button>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr>
                    <th>Job ID</th>
                    <th>User</th>
                    <th>Category</th>
                    <th>Issue</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="queueTableBody">
                  <tr><td colspan="6" class="text-center">Loading ticket queue...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Modal Component for ASSIGNING Tickets -->
  <div class="modal fade" id="assignModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Assign Job Order</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="assignModalJobId">
          <div class="mb-3">
            <label class="form-label">Assign to Technician</label>
            <input type="text" id="assignTechName" class="form-control" required value="<?= userEmail ?>">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-info" onclick="submitAssignment()">Assign</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Component for RESOLVING Tickets -->
  <div class="modal fade" id="resolveModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Complete Job Order</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="modalJobId">
          <div class="mb-3">
            <label class="form-label">Resolved By (Technician Name)</label>
            <input type="text" id="techName" class="form-control" required value="<?= userEmail ?>">
          </div>
          <div class="mb-3">
            <label class="form-label">Action Taken (How was it fixed?)</label>
            <textarea id="actionTaken" class="form-control" rows="2" required placeholder="Describe what you did..."></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Recommendations (Preventive measures)</label>
            <textarea id="recommendations" class="form-control" rows="2" placeholder="Optional advice for the user..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-success" onclick="submitResolution()">Mark as Done</button>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    const IS_TECH = <?= isTech ?>;
    const CURRENT_USER = "<?= userEmail ?>";
    
    let resolveModal, assignModal;
  
    document.addEventListener("DOMContentLoaded", function() {
      resolveModal = new bootstrap.Modal(document.getElementById('resolveModal'));
      assignModal = new bootstrap.Modal(document.getElementById('assignModal'));
      loadDashboard();
      
      document.getElementById("jobForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const user = document.getElementById("userName").value;
        const category = document.getElementById("category").value;
        const desc = document.getElementById("description").value;
        const fileInput = document.getElementById("attachment");
        const submitBtn = document.getElementById("submitBtn");
        const originalBtnText = submitBtn.innerHTML;
        
        submitBtn.innerHTML = "⏳ Uploading & Submitting...";
        submitBtn.disabled = true;
        
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const reader = new FileReader();
          reader.onload = function(e) {
            const base64Data = e.target.result.split(',')[1]; 
            submitJobToBackend(user, desc, category, base64Data, file.name, file.type, submitBtn, originalBtnText);
          };
          reader.readAsDataURL(file);
        } else {
          submitJobToBackend(user, desc, category, null, null, null, submitBtn, originalBtnText);
        }
      });
    });

    function submitJobToBackend(user, desc, category, fileData, fileName, mimeType, btn, originalText) {
      google.script.run
        .withSuccessHandler(function(response) {
          alert("Job Order successfully logged! ID: " + response);
          document.getElementById("description").value = ""; 
          document.getElementById("category").value = ""; 
          document.getElementById("attachment").value = ""; 
          btn.innerHTML = originalText;
          btn.disabled = false;
          loadDashboard();
        })
        .withFailureHandler(function(error) {
          alert("Error: " + error.message);
          btn.innerHTML = originalText;
          btn.disabled = false;
        })
        .createJobOrder(user, desc, category, fileData, fileName, mimeType);
    }
  
    function loadDashboard() {
      google.script.run
        .withSuccessHandler(function(jobs) {
          const tbody = document.getElementById("queueTableBody");
          tbody.innerHTML = "";
          
          let activeJobsCount = 0;
          
          // KPI Variables
          let countPending = 0;
          let countUnassigned = 0;
          let countDone = 0;
          let countMyResolves = 0;
          
          jobs.reverse().forEach(function(job) {
            
            // --- KPI CALCULATIONS ---
            if (job.Status === "Pending") {
              countPending++;
              if (job.Technician === "Unassigned" || job.Technician === "") {
                countUnassigned++;
              }
            } else if (job.Status === "Done") {
              countDone++;
              if (job.Technician.toLowerCase() === CURRENT_USER.toLowerCase()) {
                countMyResolves++;
              }
            }
            
            // --- QUEUE FILTERING ---
            // Skip jobs that are already "Done" so they don't clutter the Admin view
            if (job.Status === "Done") return; 
            
            activeJobsCount++;
            
            let actionButton = "";
            if (job.Technician === "Unassigned" || job.Technician === "") {
              actionButton = `<button class="btn btn-sm btn-info me-1 mb-1" onclick="openAssignModal('${job.JobID}')">Assign</button>` +
                             `<button class="btn btn-sm btn-warning mb-1" onclick="openResolveModal('${job.JobID}')">Resolve</button>`;
            } else {
              actionButton = `<span class="badge bg-secondary me-1 mb-1">Tech: ${job.Technician}</span><br>` +
                             `<button class="btn btn-sm btn-warning mb-1" onclick="openResolveModal('${job.JobID}')">Resolve</button>`;
            }

            let attachmentBadge = "";
            if (job.AttachmentURL && job.AttachmentURL.startsWith("http")) {
              attachmentBadge = `<br><a href="${job.AttachmentURL}" target="_blank" class="badge bg-light text-dark text-decoration-none mt-1 border">📎 View</a>`;
            }
              
            let row = `<tr>
              <td><strong>${job.JobID}</strong></td>
              <td>${job.UserName}</td>
              <td><span class="badge bg-primary">${job.Category}</span></td>
              <td>${job.IssueDescription} ${attachmentBadge}</td>
              <td><span class="status-pending">${job.Status}</span></td>
              <td>${actionButton}</td>
            </tr>`;
            tbody.innerHTML += row;
          });
          
          // Update the KPI Scorecards on the screen
          document.getElementById("kpiPending").innerText = countPending;
          document.getElementById("kpiUnassigned").innerText = countUnassigned;
          document.getElementById("kpiDone").innerText = countDone;
          document.getElementById("kpiMyResolves").innerText = countMyResolves;
          
          if (activeJobsCount === 0) {
            tbody.innerHTML = "<tr><td colspan='6' class='text-center'>No active jobs right now! 🎉</td></tr>";
          }
        })
        .getJobsData();
    }
  
    function openAssignModal(jobId) {
      document.getElementById("assignModalJobId").value = jobId;
      assignModal.show();
    }

    function submitAssignment() {
      const jobId = document.getElementById("assignModalJobId").value;
      const techName = document.getElementById("assignTechName").value;
      
      if (!techName) return alert("Please enter a technician name.");
      
      google.script.run
        .withSuccessHandler(function(success) {
          assignModal.hide();
          loadDashboard(); 
        })
        .withFailureHandler(function(error) {
          alert("Error assigning job: " + error.message);
        })
        .assignJobOrder(jobId, techName);
    }

    function openResolveModal(jobId) {
      document.getElementById("modalJobId").value = jobId;
      resolveModal.show();
    }
  
    function submitResolution() {
      const jobId = document.getElementById("modalJobId").value;
      const techName = document.getElementById("techName").value;
      const actionTaken = document.getElementById("actionTaken").value;
      const recommendations = document.getElementById("recommendations").value;
      
      if (!techName) return alert("Please enter a technician name.");
      if (!actionTaken) return alert("Please enter the action taken to resolve the issue.");
      
      google.script.run
        .withSuccessHandler(function(success) {
          if(success) {
            resolveModal.hide();
            document.getElementById("actionTaken").value = "";
            document.getElementById("recommendations").value = "";
            loadDashboard();
          } else {
            alert("Error: Ticket could not be located.");
          }
        })
        .withFailureHandler(function(error) {
          alert("Error resolving job: " + error.message);
        })
        .completeJobOrder(jobId, techName, actionTaken, recommendations); 
    }
  </script>
</body>
</html>
